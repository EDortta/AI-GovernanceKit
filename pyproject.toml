[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governancekit"
version = "2.3.0"
description = "Local-first governance runtime tools for AI-assisted software delivery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AI GovernanceKit maintainers" }
]
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.scripts]
governancekit = "governancekit.cli:main"

[tool.setuptools.packages.find]
include = ["governancekit*"]

# The drift snapshot is data, not code, and would otherwise be dropped from a
# built wheel — leaving `refresh-kit-snapshot.py --check` unable to read what an
# installed copy claims about the release it pins.
[tool.setuptools.package-data]
governancekit = ["_kit_snapshot.json"]
